<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">余额速率对比模板｜全部为虚构演示数据</title><desc id="desc">当前两小时每小时120元，前两小时80元，昨日同段100元。余额净下降不等于广告消耗。</desc>
<rect width="960" height="520" rx="16" fill="#f4f7fb"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" fill="#182d44">
<text x="30" y="43" font-size="25" fill="#182d44" font-weight="600">余额提醒｜资金下降是不是变快了？</text>
<text x="30" y="76" font-size="15" fill="#9b4b16" font-weight="400">模板示意 · 全部为虚构演示数据 · 不是实际余额、充值建议或投放效果</text>
<rect x="30" y="96" width="280" height="78" rx="4" fill="#ffffff"/>
<text x="46" y="121" font-size="14" fill="#526579" font-weight="400">演示可用余额</text>
<text x="46" y="155" font-size="23" fill="#182d44" font-weight="600">¥ 1,200</text>
<rect x="340" y="96" width="280" height="78" rx="4" fill="#ffffff"/>
<text x="356" y="121" font-size="14" fill="#526579" font-weight="400">按本期速率静态估算</text>
<text x="356" y="155" font-size="23" fill="#182d44" font-weight="600">约 10 小时</text>
<rect x="650" y="96" width="280" height="78" rx="4" fill="#ffffff"/>
<text x="666" y="121" font-size="14" fill="#526579" font-weight="400">本期速率变化</text>
<text x="666" y="155" font-size="23" fill="#182d44" font-weight="600">较前期 +50%</text>
<text x="30" y="225" font-size="18" fill="#182d44" font-weight="600">本两小时</text>
<text x="30" y="248" font-size="13" fill="#526579" font-weight="400">今天 10:00—12:00</text>
<rect x="240" y="210" width="480" height="32" rx="4" fill="#3478bb"/>
<text x="735" y="233" font-size="17" fill="#182d44" font-weight="400">120 元/小时</text>
<text x="30" y="290" font-size="18" fill="#182d44" font-weight="600">前两小时</text>
<text x="30" y="313" font-size="13" fill="#526579" font-weight="400">今天 08:00—10:00</text>
<rect x="240" y="275" width="320" height="32" rx="4" fill="#d38b36"/>
<text x="575" y="298" font-size="17" fill="#182d44" font-weight="400">80 元/小时</text>
<text x="30" y="355" font-size="18" fill="#182d44" font-weight="600">昨日同段</text>
<text x="30" y="378" font-size="13" fill="#526579" font-weight="400">昨天 10:00—12:00</text>
<rect x="240" y="340" width="400" height="32" rx="4" fill="#8a6abd"/>
<text x="655" y="363" font-size="17" fill="#182d44" font-weight="400">100 元/小时</text>
<line x1="240" y1="395" x2="240" y2="401" stroke="#dce4ef"/>
<text x="235" y="423" font-size="14" fill="#526579" font-weight="400">0</text>
<line x1="400" y1="395" x2="400" y2="401" stroke="#dce4ef"/>
<text x="395" y="423" font-size="14" fill="#526579" font-weight="400">40</text>
<line x1="560" y1="395" x2="560" y2="401" stroke="#dce4ef"/>
<text x="555" y="423" font-size="14" fill="#526579" font-weight="400">80</text>
<line x1="720" y1="395" x2="720" y2="401" stroke="#dce4ef"/>
<text x="715" y="423" font-size="14" fill="#526579" font-weight="400">120</text>
<line x1="240" y1="395" x2="760" y2="395" stroke="#dce4ef"/>
<text x="785" y="423" font-size="14" fill="#526579" font-weight="400">元/小时</text>
<text x="30" y="464" font-size="16" fill="#182d44" font-weight="400">怎么看：本期下降比前期快50%，比昨日同段快20%，需要结合资金变化核查。</text>
<text x="30" y="496" font-size="14" fill="#526579" font-weight="400">余额净下降速率 ≠ 广告消耗；充值、冻结变化或缺少样本时显示待核验，不画假零值。</text>
</g></svg>