<text x="635.0" y="952" font-size="14" fill="#203148" font-weight="400">100 元/小时</text>
<text x="120" y="1004" font-size="13" fill="#64748b" font-weight="400">余额净下降不等于广告消耗；充值、资金调整或缺样本时需核查。</text>
<text x="30" y="1080" font-size="14" fill="#64748b" font-weight="400">展示用途：让业务理解接收形式；实际样式、发送时刻与内容以授权配置和数据情况为准。</text>
</g></svg>