<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-label="昨日利润｜哪些商品需要关注？">
  <title>昨日利润｜哪些商品需要关注？</title>
  <rect x="0" y="0" width="960" height="590" fill="#f4f7fb" rx="16" />
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" fill="#203148">
    <text x="30" y="43" font-size="25" fill="#203148" text-anchor="start">昨日利润｜哪些商品需要关注？</text>
    <text x="30" y="76" font-size="15" fill="#9b4b16" text-anchor="start">统一虚构演示数据 · 非真实报表、截图或发送记录</text>
    <rect x="30" y="95" width="280" height="78" fill="#fff" rx="8" />
    <text x="45" y="120" font-size="14" fill="#64748b" text-anchor="start">广告消耗｜含全店托管</text>
    <text x="45" y="154" font-size="22" fill="#203148" text-anchor="start">¥4,000</text>
    <rect x="340" y="95" width="280" height="78" fill="#fff" rx="8" />
    <text x="355" y="120" font-size="14" fill="#64748b" text-anchor="start">可计算部分预计利润</text>
    <text x="355" y="154" font-size="22" fill="#203148" text-anchor="start">+¥2,200</text>
    <rect x="650" y="95" width="280" height="78" fill="#fff" rx="8" />
    <text x="665" y="120" font-size="14" fill="#64748b" text-anchor="start">数据范围</text>
    <text x="665" y="154" font-size="22" fill="#203148" text-anchor="start">3项可算 / 托管待核验</text>
    <text x="30" y="205" font-size="15" fill="#64748b" text-anchor="start">预计利润（元）｜颜色表示商品，上下位置表示盈亏</text>
    <line x1="100" y1="240.0" x2="910" y2="240.0" stroke="#dce4ef" />
    <text x="80" y="245.0" font-size="13" fill="#64748b" text-anchor="end">1,500</text>
    <line x1="100" y1="290.0" x2="910" y2="290.0" stroke="#dce4ef" />
    <text x="80" y="295.0" font-size="13" fill="#64748b" text-anchor="end">1,000</text>
    <line x1="100" y1="340.0" x2="910" y2="340.0" stroke="#dce4ef" />
    <text x="80" y="345.0" font-size="13" fill="#64748b" text-anchor="end">500</text>
    <line x1="100" y1="390.0" x2="910" y2="390.0" stroke="#9aaaba" />
    <text x="80" y="395.0" font-size="13" fill="#64748b" text-anchor="end">0</text>
    <line x1="100" y1="420.0" x2="910" y2="420.0" stroke="#dce4ef" />
    <text x="80" y="425.0" font-size="13" fill="#64748b" text-anchor="end">-300</text>
    <rect x="170" y="290.0" width="94" height="100.0" fill="#3478bb" rx="3" />
    <text x="217" y="278.0" font-size="20" fill="#203148" text-anchor="middle">+1,000</text>
    <rect x="175" y="467" width="12" height="12" fill="#3478bb" rx="2" />
    <text x="192" y="478" font-size="16" fill="#203148" text-anchor="start">商品 A</text>
    <rect x="360" y="240.0" width="94" height="150.0" fill="#d38b36" rx="3" />
    <text x="407" y="228.0" font-size="20" fill="#203148" text-anchor="middle">+1,500</text>
    <rect x="365" y="467" width="12" height="12" fill="#d38b36" rx="2" />
    <text x="382" y="478" font-size="16" fill="#203148" text-anchor="start">商品 B</text>
    <rect x="550" y="390" width="94" height="30.0" fill="#00a67d" rx="3" />
    <text x="597" y="442.0" font-size="20" fill="#cd5757" text-anchor="middle">-300</text>
    <rect x="555" y="467" width="12" height="12" fill="#00a67d" rx="2" />
    <text x="572" y="478" font-size="16" fill="#203148" text-anchor="start">商品 C</text>
    <text x="787" y="330" font-size="21" fill="#64748b" text-anchor="middle">待核验</text>
    <text x="787" y="358" font-size="14" fill="#64748b" text-anchor="middle">收入缺失</text>
    <rect x="745" y="467" width="12" height="12" fill="#c43d87" rx="2" />
    <text x="762" y="478" font-size="16" fill="#203148" text-anchor="start">全店托管</text>
    <text x="30" y="523" font-size="17" fill="#203148" text-anchor="start">A、B盈利合计 ¥2,500 − C亏损 ¥300 = 可计算部分 ¥2,200。</text>
    <text x="30" y="557" font-size="14" fill="#64748b" text-anchor="start">全店托管广告费 ¥700 已计入消耗，利润未知；预计利润不是最终财务利润。</text>
  </g>
</svg>