<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2530" viewBox="0 0 900 2530"><rect width="900" height="2530" fill="#f3f6fa"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="40" y="36" width="820" height="172" rx="24" fill="#183a59"/><text x="76" y="101" font-size="44" fill="#ffffff" font-weight="700">千川投放助手</text><text x="76" y="153" font-size="28" fill="#d8e7f4" font-weight="400">业务功能一览 · 看清投放，再做判断</text><path d="M76 208 V2103" stroke="#b5c9d9" stroke-width="4" fill="none"/><path d="M76 289 H112" stroke="#b5c9d9" stroke-width="4"/><circle cx="76" cy="289" r="9" fill="#277a9b"/><rect x="112" y="246" width="748" height="286" rx="20" fill="white" stroke="#dce5ed"/><text x="140" y="300" font-size="26" fill="#277a9b" font-weight="700">01</text><text x="194" y="300" font-size="34" fill="#183a59" font-weight="700">看经营结果</text><path d="M151 333 V475" stroke="#d4e2eb" stroke-width="2"/><path d="M151 343 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="352" font-size="28" fill="#183a59" font-weight="600">昨日赚不赚钱</text><text x="182" y="391" font-size="27" fill="#53657a" font-weight="400">查看预估利润与亏损商品</text><path d="M151 431 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="440" font-size="28" fill="#183a59" font-weight="600">今天优先看谁</text><text x="182" y="479" font-size="27" fill="#53657a" font-weight="400">盈利、亏损、花费各列最多三项</text><path d="M76 599 H112" stroke="#b5c9d9" stroke-width="4"/><circle cx="76" cy="599" r="9" fill="#277a9b"/><rect x="112" y="556" width="748" height="374" rx="20" fill="white" stroke="#dce5ed"/><text x="140" y="610" font-size="26" fill="#277a9b" font-weight="700">02</text><text x="194" y="610" font-size="34" fill="#183a59" font-weight="700">看钱花在哪</text><path d="M151 643 V873" stroke="#d4e2eb" stroke-width="2"/><path d="M151 653 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="662" font-size="28" fill="#183a59" font-weight="600">按商品看</text><text x="182" y="701" font-size="27" fill="#53657a" font-weight="400">哪些商品的花费增加或减少</text><path d="M151 741 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="750" font-size="28" fill="#183a59" font-weight="600">按时段看</text><text x="182" y="789" font-size="27" fill="#53657a" font-weight="400">对比两天各时段的花费变化</text><path d="M151 829 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="838" font-size="28" fill="#183a59" font-weight="600">花费是否值得</text><text x="182" y="877" font-size="27" fill="#53657a" font-weight="400">对比盈利贡献和广告花费占比</text><path d="M76 997 H112" stroke="#b5c9d9" stroke-width="4"/><circle cx="76" cy="997" r="9" fill="#277a9b"/><rect x="112" y="954" width="748" height="286" rx="20" fill="white" stroke="#dce5ed"/><text x="140" y="1008" font-size="26" fill="#277a9b" font-weight="700">03</text><text x="194" y="1008" font-size="34" fill="#183a59" font-weight="700">看资金风险</text><path d="M151 1041 V1183" stroke="#d4e2eb" stroke-width="2"/><path d="M151 1051 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="1060" font-size="28" fill="#183a59" font-weight="600">余额还能用多久</text><text x="182" y="1099" font-size="27" fill="#53657a" font-weight="400">结合当前消耗速度估算</text><path d="M151 1139 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="1148" font-size="28" fill="#183a59" font-weight="600">花钱是否变快</text><text x="182" y="1187" font-size="27" fill="#53657a" font-weight="400">对比前两小时和昨日同时段</text><path d="M76 1307 H112" stroke="#b5c9d9" stroke-width="4"/><circle cx="76" cy="1307" r="9" fill="#277a9b"/><rect x="112" y="1264" width="748" height="462" rx="20" fill="white" stroke="#dce5ed"/><text x="140" y="1318" font-size="26" fill="#277a9b" font-weight="700">04</text><text x="194" y="1318" font-size="34" fill="#183a59" font-weight="700">在飞书接收结果</text><path d="M151 1351 V1669" stroke="#d4e2eb" stroke-width="2"/><path d="M151 1361 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="1370" font-size="28" fill="#183a59" font-weight="600">每天看日报</text><text x="182" y="1409" font-size="27" fill="#53657a" font-weight="400">重点导读、利润图、两日对比</text><path d="M151 1449 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="1458" font-size="28" fill="#183a59" font-weight="600">需要时查明细</text><text x="182" y="1497" font-size="27" fill="#53657a" font-weight="400">Excel 查看每个计划</text><path d="M151 1537 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="1546" font-size="28" fill="#183a59" font-weight="600">及时收提醒</text><text x="182" y="1585" font-size="27" fill="#53657a" font-weight="400">同批规则异常合并，资金提醒单列</text><path d="M151 1625 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="1634" font-size="28" fill="#183a59" font-weight="600">直接问昨日结果</text><text x="182" y="1673" font-size="27" fill="#53657a" font-weight="400">谁赚得多、谁亏得多、钱花在哪</text><path d="M76 1793 H112" stroke="#b5c9d9" stroke-width="4"/><circle cx="76" cy="1793" r="9" fill="#277a9b"/><rect x="112" y="1750" width="748" height="286" rx="20" fill="white" stroke="#dce5ed"/><text x="140" y="1804" font-size="26" fill="#277a9b" font-weight="700">05</text><text x="194" y="1804" font-size="34" fill="#183a59" font-weight="700">跟进数据缺口</text><path d="M151 1837 V1979" stroke="#d4e2eb" stroke-width="2"/><path d="M151 1847 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="1856" font-size="28" fill="#183a59" font-weight="600">本地登记待核验</text><text x="182" y="1895" font-size="27" fill="#53657a" font-weight="400">区分真实数据、业务补值与缺失</text><path d="M151 1935 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="1944" font-size="28" fill="#183a59" font-weight="600">后续复查并记录差额</text><text x="182" y="1983" font-size="27" fill="#53657a" font-weight="400">复查最近7个完整自然日，旧报表不改</text><path d="M76 2103 H112" stroke="#b5c9d9" stroke-width="4"/><circle cx="76" cy="2103" r="9" fill="#277a9b"/><rect x="112" y="2060" width="748" height="374" rx="20" fill="white" stroke="#dce5ed"/><text x="140" y="2114" font-size="26" fill="#277a9b" font-weight="700">06</text><text x="194" y="2114" font-size="34" fill="#183a59" font-weight="700">明确使用边界</text><path d="M151 2147 V2377" stroke="#d4e2eb" stroke-width="2"/><path d="M151 2157 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="2166" font-size="28" fill="#183a59" font-weight="600">目前由投手决策</text><text x="182" y="2205" font-size="27" fill="#53657a" font-weight="400">不自动改预算、ROI 或暂停计划</text><path d="M151 2245 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="2254" font-size="28" fill="#183a59" font-weight="600">利润仍是预估</text><text x="182" y="2293" font-size="27" fill="#53657a" font-weight="400">最终结果需核对实际退款与费用</text><path d="M151 2333 H169" stroke="#d4e2eb" stroke-width="2"/><text x="182" y="2342" font-size="28" fill="#183a59" font-weight="600">后续继续完善</text><text x="182" y="2381" font-size="27" fill="#53657a" font-weight="400">跟踪建议效果与节省的工时</text><text x="112" y="2484" font-size="27" fill="#53657a" font-weight="400">助手负责分析与提醒，投手负责判断与调整。</text></svg>